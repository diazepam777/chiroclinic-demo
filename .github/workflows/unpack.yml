name: unpack-demo
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle
        run: |
          if [ ! -d bundle ]; then echo nothing; exit 0; fi
          cat bundle/site.b64.part* | base64 -d | tar xz
          git rm -r -q bundle
          git config user.name demo-bot
          git config user.email demo-bot@users.noreply.github.com
          git add -A
          git commit -m "Unpack demo site"
          git push
